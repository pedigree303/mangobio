html, body {
  background: #000 !important;
}

.page {
  position: relative;
  isolation: isolate;
  background: #000 !important;
}


.page::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: #000;
}


.page::after {
  content: none !important;
  display: none !important;
  background: none !important;
}


.visual {
  position: fixed;
  top: 0;
  left: 0;
  width: 50vw;
  height: 100vh;
  overflow: hidden;
  z-index: 1;
  background: #000;
  pointer-events: none;
}

.visual img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 38% center;
  filter: grayscale(1) contrast(1.08) brightness(.84);
  transform: none;
  opacity: .94;
}

.visual::before,
.visual::after {
  content: none !important;
  display: none !important;
}

.content {
  grid-column: 2;
  position: relative;
  z-index: 2;
  min-width: 0;
  min-height: 100vh;
  background: transparent !important;
  box-shadow: none !important;
}

.content::before,
.content::after {
  content: none !important;
  display: none !important;
}

@media (max-width: 800px) {
  .page { display: block; }

  .visual {
    position: relative;
    width: 100%;
    height: 54vh;
    z-index: 1;
  }

  .visual img {
    width: 100%;
    height: 54vh;
    object-position: 35% 38%;
  }

  .content {
    grid-column: auto;
    padding:42px 22px 40px;
    min-height: auto;
    z-index: 2;
  }
}

.social-rail{
  position:fixed !important;
  top:32px !important;
  left:50% !important;
  right:auto !important;
  bottom:auto !important;
  transform:translateX(-50%) !important;
  flex-direction:row !important;
  align-items:center !important;
  justify-content:center !important;
  gap:14px !important;
  z-index:100 !important;
}
.social-rail .rail-label{
  right:auto !important; left:50% !important; top:calc(100% + 9px) !important;
  transform:translateX(-50%) !important;
}
.social-rail a:hover .rail-label,
.social-rail button:hover .rail-label{opacity:1}
.social-rail .lol-account-menu{
  right:auto !important; left:50% !important; top:calc(100% + 12px) !important;
  transform:translateX(-50%) !important;

}

.language-card{width:min(100%,620px);text-align:center;border:1px solid #292329;background:rgba(8,7,9,.82);padding:24px 26px;color:#aaa}

  <script>
    const lolToggle = document.getElementById('lolMenuToggle');
    const lolMenu = document.getElementById('lolAccountMenu');
    lolToggle.addEventListener('click', () => {
      const open = lolToggle.getAttribute('aria-expanded') === 'true';
      lolToggle.setAttribute('aria-expanded', String(!open));
      lolMenu.hidden = open;
    });
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.lol-chooser')) {
        lolMenu.hidden = true;
        lolToggle.setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        lolMenu.hidden = true;
        lolToggle.setAttribute('aria-expanded', 'false');
        lolToggle.focus();
      }
    });
    document.getElementById('discordCopy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText('krultepes2627'); } catch (error) {}
    });

    const plTab = document.getElementById('plTab');
    const enTab = document.getElementById('enTab');
    const languageCopy = document.getElementById('languageCopy');
    const languageTexts = {
      pl: 'znudzil mi sie pomysl, moze kiedys do niego wroce zobaczymy.',
      en: 'I got bored with the idea, maybe I’ll come back to it someday.'
    };
    function setLanguage(language) {
      const polish = language === 'pl';
      languageCopy.textContent = languageTexts[language];
      languageCopy.lang = language;
      plTab.classList.toggle('active', polish);
      enTab.classList.toggle('active', !polish);
      plTab.setAttribute('aria-selected', String(polish));
      enTab.setAttribute('aria-selected', String(!polish));
    }
    plTab.addEventListener('click', () => setLanguage('pl'));
    enTab.addEventListener('click', () => setLanguage('en'));
  </script>
